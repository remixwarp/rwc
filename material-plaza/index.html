<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材广场</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶部栏 -->
    <div class="header">
        <div class="header-left">
            <h1 class="header-title">素材广场</h1>
        </div>
        <div class="header-actions">
            <button id="themeToggleBtn" class="icon-btn" title="切换深浅色">
                <svg id="themeToggleIcon" width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor">
                    <path d="M512 128c-211.2 0-384 172.8-384 384s172.8 384 384 384 384-172.8 384-384-172.8-384-384-384z m0 678.4V217.6c153.6 0 281.6 128 281.6 281.6s-128 281.6-281.6 281.6z"/>
                </svg>
            </button>
            <button id="langToggleBtn" class="icon-btn" title="EN">中</button>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-row">
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索素材名称、作者、类型..." />
            </div>
            <button id="refreshBtn" class="icon-btn" title="刷新">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6M3 12a9 9 0 0 1 15.364-6.364L21 8M3 22v-6h6M21 12a9 9 0 0 1-15.364 6.364L3 16"/>
                </svg>
            </button>
            <button id="addBtn" class="primary-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span id="addBtnText">添加素材</span>
            </button>
        </div>
        <div id="editorHint" class="editor-hint" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <a id="editorHintLink" href="https://rw-c.pages.dev/material-plaza/" target="_blank" rel="noopener noreferrer">上传素材请转到独立页面</a>
        </div>
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="script">积木</button>
            <button class="filter-btn" data-filter="sprite">角色</button>
            <button class="filter-btn" data-filter="costume">造型</button>
            <button class="filter-btn" data-filter="sound">声音</button>
        </div>
    </div>

    <!-- 素材网格 -->
    <div class="content">
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>正在加载素材列表...</p>
        </div>
        <div id="emptyState" class="empty-state" style="display:none">
            <div class="empty-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
                </svg>
            </div>
            <h3>暂无素材</h3>
            <p>点击右上角的 + 按钮添加你的第一个素材</p>
        </div>
        <div id="materialGrid" class="material-grid"></div>
    </div>

    <!-- 上传弹窗 -->
    <div id="uploadModal" class="modal" style="display:none">
        <div class="modal-overlay"></div>
        <div class="modal-content upload-modal">
            <div class="modal-header">
                <h2>上传素材</h2>
                <button class="modal-close" id="uploadModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>作者名称 *</label>
                    <input type="text" id="authorInput" class="form-input" placeholder="输入作者名称" />
                </div>
                <div class="form-group title-group">
                    <label>标题 *</label>
                    <input type="text" id="titleInput" class="form-input title-input" placeholder="输入素材标题" />
                </div>
                <div class="form-group desc-group">
                    <label><span class="desc-label-text">素材描述</span> <span class="optional-label">(选填)</span></label>
                    <textarea id="descInput" class="form-textarea desc-input" placeholder="输入素材描述（选填）" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>选择素材文件 *</label>
                    <div id="fileUploadZone" class="file-upload-zone">
                        <input type="file" id="fileInput" class="file-input" accept=".sprite3,.svg,.png,.wav,.mp3" />
                        <div class="file-upload-placeholder" id="fileUploadPlaceholder">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="12"/><line x1="15" y1="15" x2="12" y2="12"/>
                            </svg>
                            <p>点击选择文件</p>
                            <span class="file-upload-hint">支持 .sprite3(角色) .svg/.png(造型) .wav/.mp3(音频)</span>
                        </div>
                        <div id="filePreview" class="file-preview" style="display:none">
                            <div class="file-preview-thumb" id="filePreviewThumb"></div>
                            <div class="file-preview-info">
                                <span class="file-preview-name" id="filePreviewName"></span>
                                <span class="file-preview-type" id="filePreviewType"></span>
                            </div>
                            <button class="file-preview-remove" id="filePreviewRemove">&times;</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label><span class="cover-label-text">封面图</span> <span class="optional-label">(选填)</span></label>
                    <div id="coverUploadZone" class="file-upload-zone cover-upload-zone">
                        <input type="file" id="coverInput" class="file-input" accept="image/*" />
                        <div class="file-upload-placeholder" id="coverUploadPlaceholder">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
                                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                            </svg>
                            <p>选择封面图片（可选）</p>
                        </div>
                        <div id="coverPreview" class="file-preview" style="display:none">
                            <div class="cover-preview-thumb" id="coverPreviewThumb"></div>
                            <div class="file-preview-info">
                                <span class="file-preview-name" id="coverPreviewName"></span>
                            </div>
                            <button class="file-preview-remove" id="coverPreviewRemove">&times;</button>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" id="uploadCancelBtn">取消</button>
                    <button class="btn btn-primary" id="uploadSubmitBtn" disabled>上传素材</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 人机验证弹窗 -->
    <div id="captchaModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content small">
            <div class="modal-header">
                <h2 id="captchaModalTitle">人机验证</h2>
            </div>
            <div class="modal-body" style="text-align:center;padding:30px;">
                <p id="captchaHint" style="margin-bottom:20px;color:var(--text-muted);">请完成验证后继续上传</p>
                <div id="captchaContainer"></div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast"></div>

    <script src="https://captcha.gurl.eu.org/cap.min.js"></script>
    <script src="editor-bridge.js"></script>
    <script src="app.js"></script>
</body>
</html>
