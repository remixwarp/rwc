<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置广场 | RemixWarp Config Plaza</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <h1>配置广场</h1>
            </div>
            <div class="header-actions">
                <button id="langToggleBtn" class="icon-btn" title="EN">中</button>
                <button id="themeToggleBtn" class="icon-btn" title="切换深浅色">
                    <svg id="themeToggleIcon" width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor">
                        <path d="M512 59.733333c249.770667 0 452.266667 202.496 452.266667 452.266667 0 249.770667-202.496 452.266667-452.266667 452.266667-249.770667 0-452.266667-202.496-452.266667-452.266667C59.733333 262.229333 262.229333 59.733333 512 59.733333z m0 93.866667a358.4 358.4 0 1 0 0 716.8 358.4 358.4 0 0 0 0-716.8z m0 140.501333c0-32.853333 26.922667-60.074667 59.008-53.162666a277.418667 277.418667 0 0 1 0 542.122666c-32.085333 6.912-59.008-20.309333-59.008-53.162666V294.101333z"></path>
                    </svg>
                </button>
                <button id="refreshBtn" class="icon-btn" title="刷新">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"/>
                        <polyline points="1 20 1 14 7 14"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
                <div class="editor-status" id="editorStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">未连接编辑器</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="search-bar-wrapper">
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索配置名称、作者、主题色、描述..." />
                <button id="searchClearBtn" class="search-clear-btn" style="display:none;" title="清除">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <span id="searchResultCount" class="search-result-count" style="display:none;"></span>
        </div>

        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>加载配置中...</p>
        </div>

        <div id="emptyState" class="empty-state" style="display:none;">
            <div class="empty-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </div>
            <h3>暂无配置</h3>
            <p>点击右下角的 + 按钮上传你的第一个配置</p>
        </div>

        <div id="configGrid" class="config-grid" style="display:none;"></div>
    </main>

    <!-- Floating Upload Button -->
    <button id="fabBtn" class="fab" title="上传配置">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>上传配置</h2>
                <button class="close-btn" id="closeModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="upload-sources">
                    <button class="source-btn" id="selectFileBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <span>选择文件</span>
                        <small>(.rwc 格式)</small>
                    </button>
                </div>

                <input type="file" id="fileInput" accept=".rwc" style="display:none;">

                <div class="file-info" id="fileInfo" style="display:none;">
                    <div class="file-info-row">
                        <span class="label">文件:</span>
                        <span class="value" id="fileName">-</span>
                    </div>
                    <div class="file-info-row">
                        <span class="label">大小:</span>
                        <span class="value" id="fileSize">-</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>配置名称 <span class="required">*</span></label>
                    <input type="text" id="configName" maxlength="50" placeholder="为配置命名 (最多50字)">
                    <span class="counter"><span id="nameCount">0</span>/50</span>
                </div>

                <div class="form-group">
                    <label>作者 <span class="required">*</span></label>
                    <input type="text" id="configAuthor" maxlength="30" placeholder="你的昵称 (最多30字)">
                    <span class="counter"><span id="authorCount">0</span>/30</span>
                </div>

                <div class="form-group">
                    <label>主题检测</label>
                    <div class="theme-detection" id="themeDetection">
                        <div class="theme-item">
                            <span class="theme-label">GUI 主题</span>
                            <span class="theme-value" id="detectedTheme">检测中...</span>
                        </div>
                        <div class="theme-item">
                            <span class="theme-label">主题色</span>
                            <div class="accent-display">
                                <span class="accent-color" id="accentColor" style="background:#ccc;"></span>
                                <span class="theme-value" id="accentName">-</span>
                            </div>
                        </div>
                        <div class="theme-item">
                            <span class="theme-label">深色模式</span>
                            <span class="theme-value" id="isDark">检测中...</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>描述 <span class="optional">(可选)</span></label>
                    <textarea id="configDesc" maxlength="50" placeholder="简要描述这个配置 (最多50字)" rows="2"></textarea>
                    <span class="counter"><span id="descCount">0</span>/50</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelUpload">取消</button>
                <button class="btn-primary" id="confirmUpload" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span id="uploadBtnText">上传配置</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Apply Confirmation Modal -->
    <div id="applyModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content small">
            <div class="modal-header">
                <h2>应用到编辑器</h2>
                <button class="close-btn" id="closeApplyModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="apply-url-display">
                    <span class="url-label">配置链接:</span>
                    <code id="applyUrl" class="apply-url"></code>
                </div>
                <p class="apply-hint">
                    点击下方按钮将在编辑器中打开此配置。<br>
                    如果编辑器未响应，请复制链接手动访问。
                </p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="copyUrlBtn">复制链接</button>
                <button class="btn-primary" id="applyToEditorBtn">应用到编辑器</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" style="display:none;"></div>

    <!-- Persistent refresh badge (shown after apply success) -->
    <div id="refreshBadge" class="refresh-badge" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>刷新以生效</span>
    </div>

    <!-- Red warning modal: tells user to refresh editor for changes -->
    <div id="refreshWarningModal" class="refresh-warning-modal" style="display:none;">
        <div class="refresh-warning-backdrop"></div>
        <div class="refresh-warning-card">
            <div class="refresh-warning-icon">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <div class="refresh-warning-title">请刷新编辑器</div>
            <div class="refresh-warning-message">配置已成功应用，但部分主题与设置需刷新编辑器页面才能完全生效。</div>
            <div class="refresh-warning-action">
                <button id="refreshWarningCloseBtn" class="refresh-warning-btn">我知道了</button>
            </div>
        </div>
    </div>

    <!-- 人机验证弹窗 -->
    <div id="captchaModal" class="modal" style="display:none;">
        <div class="modal-overlay"></div>
        <div class="modal-content small">
            <div class="modal-header">
                <h2 id="captchaModalTitle">人机验证</h2>
            </div>
            <div class="modal-body" style="text-align:center;padding:30px;">
                <p style="margin-bottom:20px;color:var(--text-muted);">请完成验证后继续上传</p>
                <div id="captchaContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://captcha.gurl.eu.org/cap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="editor-bridge.js"></script>
    <script src="app.js"></script>
</body>
</html>
